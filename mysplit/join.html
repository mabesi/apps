<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0F172A">
    <title>Convite - MySplit</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">

    <!--
        Prévia genérica de propósito: o WhatsApp/Telegram buscam esta página para
        gerar o preview, e o nome do grupo não deve vazar para quem só viu o link.
        O nome aparece dentro do app, depois de validar o convite.
    -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Você foi convidado para um grupo no MySplit">
    <meta property="og:description" content="Toque para abrir o app e entrar no grupo.">
    <meta property="og:image" content="https://apps.mabesi.dev/mysplit/img/icon.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 50% 0%, #1E293B 0%, #0F172A 60%);
            color: #F8FAFC;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 28px 24px;
            text-align: center;
        }

        .icon {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            margin-bottom: 18px;
        }

        h1 { font-size: 20px; line-height: 1.3; margin-bottom: 8px; }

        p {
            color: #94A3B8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .button-primary {
            background: linear-gradient(135deg, #35b288, #22a699);
            color: #0F172A;
        }

        .button-secondary {
            background: transparent;
            border: 1px solid #334155;
            color: #CBD5E1;
        }

        .code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 15px;
            color: #F8FAFC;
            background: #0F172A;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 14px;
            word-break: break-all;
        }

        .hint {
            color: #64748B;
            font-size: 12px;
            margin-top: 16px;
            margin-bottom: 0;
        }

        .hidden { display: none; }
    </style>
</head>

<body>
    <main class="card">
        <img class="icon" src="img/icon.png" alt="MySplit" width="72" height="72">

        <h1 id="title">Abrindo o MySplit…</h1>
        <p id="subtitle">Se o app não abrir sozinho, use um dos botões abaixo.</p>

        <div id="token-box" class="hidden">
            <div class="code" id="token-value"></div>
            <button class="button button-secondary" id="copy-button" type="button">Copiar código</button>
        </div>

        <a class="button button-primary" id="open-button"
            href="https://play.google.com/store/apps/details?id=com.mabesi.mysplit">Abrir o MySplit</a>

        <a class="button button-secondary" id="install-button"
            href="https://play.google.com/store/apps/details?id=com.mabesi.mysplit">Instalar na Play Store</a>

        <p class="hint" id="hint">Depois de instalar, toque neste link novamente.</p>
    </main>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var token = (params.get('t') || '').trim();

            var title = document.getElementById('title');
            var subtitle = document.getElementById('subtitle');
            var tokenBox = document.getElementById('token-box');
            var tokenValue = document.getElementById('token-value');
            var openButton = document.getElementById('open-button');
            var copyButton = document.getElementById('copy-button');
            var hint = document.getElementById('hint');

            // Tudo que vem do link é entrada não confiável: o token só é usado
            // depois de bater o formato esperado (22 caracteres url-safe).
            var isValid = /^[A-Za-z0-9_-]{22}$/.test(token);

            if (!isValid) {
                title.textContent = 'Convite inválido';
                subtitle.textContent = 'Este link está incompleto ou expirou. Peça um novo convite a quem criou o grupo.';
                openButton.classList.add('hidden');
                hint.classList.add('hidden');
                return;
            }

            tokenValue.textContent = token;
            tokenBox.classList.remove('hidden');

            var encodedToken = encodeURIComponent(token);
            var fallback = encodeURIComponent(window.location.href);

            openButton.href =
                'intent://apps.mabesi.dev/mysplit/join.html?t=' + encodedToken +
                '#Intent;scheme=https;package=com.mabesi.mysplit;S.browser_fallback_url=' + fallback + ';end';

            title.textContent = 'Você foi convidado para um grupo';
            subtitle.textContent = 'Toque em abrir para entrar. O nome do grupo aparece dentro do app.';

            copyButton.addEventListener('click', function () {
                var done = function () {
                    copyButton.textContent = 'Copiado!';
                    setTimeout(function () { copyButton.textContent = 'Copiar código'; }, 2000);
                };

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(token).then(done, done);
                    return;
                }

                // Fallback para navegadores sem Clipboard API.
                var area = document.createElement('textarea');
                area.value = token;
                document.body.appendChild(area);
                area.select();
                try { document.execCommand('copy'); } catch (error) { /* ignorado */ }
                document.body.removeChild(area);
                done();
            });

            // Tenta abrir o app imediatamente. Quando o App Link está verificado
            // esta página nem chega a carregar; isso cobre o caso "app instalado
            // mas verificação ainda não propagou".
            setTimeout(function () {
                window.location.href = openButton.href;
            }, 300);
        })();
    </script>
</body>

</html>
